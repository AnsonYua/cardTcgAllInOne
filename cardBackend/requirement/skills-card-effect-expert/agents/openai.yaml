interface:
  display_name: "Card Effect Expert"
  short_description: "Diagnose and fix card effect semantics and parity issues"
  default_prompt: "Use $skills-card-effect-expert to diagnose and fix effect.rules/effect.description parity issues between backend card data and frontend behavior. Audit dynamic filters (SOURCE_AP/SOURCE_LEVEL), sourceLevelScope semantics (paired_unit vs source_card), event-condition semantics (especially BATTLE_DESTROY attacker/defender checks and mutual-destruction timing), operator parsing, action gating (allow_attack_target/restrict_attack), and multi-step If-you-do/Then branch completeness (stepId + stepResolved + conditional), then add regression tests and update EFFECT_PARITY_AUDIT.md with findings."
